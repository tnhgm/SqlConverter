name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build ClassLibrary (CLI, both conversion directions)
        run: dotnet build ClassLibrary/ClassLibrary.csproj -c Release

      - name: Build ApplicationForm (WinForms UI)
        run: dotnet build ApplicationForm/ApplicationForm.csproj -c Release
